<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能专利聚类与推荐平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>智能专利聚类与推荐平台</h1>
        <p>这是一个基于图神经网络和机器学习的智能专利聚类与推荐平台。</p>
    </header>
    <nav>
        <a href="#">首页</a>
        <a href="#search">查询</a>
        <a href="#cluster">聚类</a>
        <a href="https://github.com/Yodeesy/Intelligent-Patent-Clustering-and-Recommendation-Platform.git" target="_blank">项目仓库</a>
    </nav>

    <section id="search">
        <h2>搜索相似专利</h2>
        <div class="search-box">
            <input type="text" id="author" placeholder="作者">
            <input type="text" id="applicant" placeholder="申请人">
            <input type="text" id="title" placeholder="标题关键词">
            <input type="text" id="province" placeholder="国省名称">
            <input type="text" id="pub_no" placeholder="公开号">
            <input type="text" id="pub_date" placeholder="公开日期（YYYY-MM-DD）">
            <input type="text" id="CLC" placeholder="中图分类号">
            <br>
            <button onclick="searchPatents()">搜索相似专利</button>
        </div>
    </section>

    <section id="cluster">
        <h2>专利聚类查看</h2>
        <div class="cluster-box">
            <input type="number" id="cluster_id" placeholder="输入聚类编号（例如 0）" style="width: calc(33.33% - 22px); padding: 12px; margin: 8px 5px; font-size: 1rem; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
            <button onclick="viewCluster()">查看该聚类专利</button>
            <button onclick="loadClusterSummary()">查看聚类总览</button>
        </div>
    </section>

    <section id="results">
        <div id="resultsContainer">
            </div>
    </section>

    <footer>
        <p>&copy; 2025 Intelligent Patent Clustering and Recommendation Platform. 保留所有权利。</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
