spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    neo4j:
      repositories:
        enabled: false  # ✅ 禁用 Neo4j repositories 自动注入
  neo4j:
    uri: dummy://disabled  # ✅ 避免尝试连接
    authentication:
      username: dummy
      password: dummy

  mvc:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:YourJwtSecretKey}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.patent: DEBUG
  file:
    path: ${LOG_PATH:./logs}
    name: ${LOG_PATH:./logs}/application.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

security:
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:100}
    duration: ${RATE_LIMIT_DURATION:3600}

python:
  service:
    url: http://localhost:5000

---

spring:
  config:
    activate:
      on-profile: dev
  data:
    neo4j:
      uri: bolt://localhost:7687

logging:
  level:
    root: DEBUG
    com.patent: TRACE

---

spring:
  config:
    activate:
      on-profile: prod
  data:
    neo4j:
      uri: ${NEO4J_URI}

logging:
  level:
    root: INFO
    com.patent: INFO
